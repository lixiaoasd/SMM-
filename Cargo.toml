[package]
name = "stardew-mod-manager"
version = "0.3.0"
edition = "2024"
description = "星露谷物语模组管理器 — Stardew Valley mod manager"
license = "MIT"
default-run = "stardew-mod-manager"

[[bin]]
name = "stardew-mod-manager"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
egui = "0.36"
egui_extras = { version = "0.36", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["blocking", "json"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
walkdir = "2.4"
anyhow = "1.0"
regex = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[features]
default = []
# 发布锁定版：镜像地址锁死为默认服务器，界面只开放镜像直装
# （隐藏镜像地址设置、N 网 API Key 设置、N 网外链；联机补齐强制走镜像）。
# 构建：cargo build --release --features locked-mirror
locked-mirror = []

[profile.release]
opt-level = 2
strip = false
