# 星露谷镜像站 —— smmsever.xyz（Cloudflare 代理 → 本源站）
#
# 部署位置：/etc/nginx/sites-available/mirror（软链到 sites-enabled/mirror）
# 依赖：
#   ① /etc/nginx/ssl/smmsever.xyz.pem / .key  —— Cloudflare Origin CA 证书
#   ② /etc/nginx/conf.d/cloudflare-ips.conf   —— 由 update-cloudflare-ips.sh 生成，
#      提供 $is_cloudflare 变量与 real_ip 还原
#
# 换 nginx 版本时注意：Ubuntu 24.04 是 1.24，用下面 `listen ... http2;` 的写法；
# nginx ≥ 1.25 里该参数被废弃，要改成 `listen 443 ssl;` + `http2 on;`。

# 限流：单 IP 每秒 30 个请求（一次下载就 1 个请求，正常用户完全够用）
limit_req_zone $binary_remote_addr zone=mirror_req:10m rate=30r/s;
# 限并发：单 IP 最多 16 条连接，防单个客户端把连接数占满
limit_conn_zone $binary_remote_addr zone=mirror_conn:10m;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name smmsever.xyz;

    ssl_certificate     /etc/nginx/ssl/smmsever.xyz.pem;
    ssl_certificate_key /etc/nginx/ssl/smmsever.xyz.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/mirror;
    autoindex off;
    client_max_body_size 1m;      # 只做下载，不需要任何上传体积

    # 只允许 Cloudflare 回源：直连源站 IP 的请求一律丢弃（444 = 不回包直接断）。
    # $is_cloudflare 由 conf.d/cloudflare-ips.conf 的 geo 块定义。
    if ($is_cloudflare = 0) { return 444; }

    limit_conn mirror_conn 16;
    limit_req zone=mirror_req burst=60 nodelay;

    # 清单文件：短缓存，保证每日同步出来的新内容几分钟内可见
    location = /index.json {
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }
    location = /collections.json {
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    # 模组包：长缓存（文件按版本命名，内容不会变）。Cloudflare 边缘会直接命中缓存，
    # 源站基本不用出带宽。
    location /mods/ {
        add_header Cache-Control "public, max-age=604800, immutable" always;
        try_files $uri =404;
    }

    # 缩略图：长缓存
    location /thumbs/ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # 点文件（.git/.env 之类）一律不可访问；index.json.tmp 不是点文件，正常同步不受影响
    location ~ /\. { deny all; }

    location / { try_files $uri $uri/ =404; }

    # zip 已经是压缩包，不再重复压缩；json 值得压
    gzip on;
    gzip_min_length 1024;
    gzip_types application/json text/plain;

    access_log /var/log/nginx/mirror-access.log;
    error_log  /var/log/nginx/mirror-error.log;
}

# 80 端口：按「只允许 Cloudflare」的策略，源站不再对外提供 HTTP。
# 443 走 Cloudflare Full (strict)，回源不需要 80，所以这里直接丢弃。
#
# ⚠ 过渡期开关：若将来还有客户端把镜像地址写死成 http://<源站IP>（走 80），
#   80 一旦关闭它们就全部不可用。需要兼容时把下面两行换成：
#       root /var/www/mirror;
#       location / { try_files $uri $uri/ =404; }
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}