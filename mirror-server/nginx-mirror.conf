# 星露谷镜像站 —— 静态文件服务（阶段一：IP 直连，域名还在备案）
#
# 部署位置：/etc/nginx/sites-available/mirror（软链到 sites-enabled/mirror）
# 客户端当前用 http://116.62.231.162 访问，所以这里只监听 80。
#
# 为什么不直接上 HTTPS + 域名：源站在阿里云杭州（大陆节点），
# 未备案域名解析到大陆服务器会被阿里云阻断，必须先完成 ICP 备案；
# 套 Cloudflare 也绕不过去（回源请求的 Host/SNI 就是那个域名）。
#
# 阶段二（备案通过后）：
#   ① 域名 A 记录直接解析到本机（建议灰云直连，大陆用户比走 Cloudflare 快）；
#   ② apt install certbot python3-certbot-nginx
#      certbot --nginx -d smmsever.xyz     # 自动签发证书并补 443 配置
#   ③ 把 80 改成 301 跳转到 https（certbot 会问你要不要改，选改）
#   ④ 客户端默认镜像地址换成 https://smmsever.xyz 后重新发版
#   ⑤ 若日后被打，再考虑把域名挂 Cloudflare 橙云（届时加回源白名单）

# 限流：单 IP 每秒 30 个请求（一次下载只占 1 个请求，正常使用完全够）
limit_req_zone $binary_remote_addr zone=mirror_req:10m rate=30r/s;
# 限并发：单 IP 最多 16 条连接，防单个客户端把连接占满
limit_conn_zone $binary_remote_addr zone=mirror_conn:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/mirror;
    autoindex off;
    server_tokens off;            # 不回显 nginx 版本号
    client_max_body_size 1m;      # 只做下载，不需要任何上传体积

    limit_conn mirror_conn 16;
    limit_req zone=mirror_req burst=60 nodelay;

    # 清单文件：短缓存，每日同步出的新内容几分钟内可见
    location = /index.json {
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }
    location = /collections.json {
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    # 模组包：长缓存（文件按版本命名，内容不会变）
    location /mods/ {
        add_header Cache-Control "public, max-age=604800, immutable" always;
        try_files $uri =404;
    }

    # 缩略图：长缓存
    location /thumbs/ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # 点文件（.git/.env 之类）一律不可访问；index.json.tmp 不是点文件，同步不受影响
    location ~ /\. { deny all; }

    location / { try_files $uri $uri/ =404; }

    # zip 已经是压缩包，不再重复压缩；json 值得压
    gzip on;
    gzip_min_length 1024;
    gzip_types application/json text/plain;

    access_log /var/log/nginx/mirror-access.log;
    error_log  /var/log/nginx/mirror-error.log;

    # 备案期间若担心「域名被解析过来导致提供未备案服务」，可打开下面这行
    # （只认 IP 访问，其它 Host 直接断开）：
    # if ($host != "116.62.231.162") { return 444; }
}